name: Word Aura Android

on:
  push:
    branches: [main]
    paths:
      - "word-aura/**"
      - ".github/workflows/android.yml"
    tags: ["word-aura-v*"]
  pull_request:
    paths:
      - "word-aura/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: word-aura

jobs:
  checks:
    name: Validate content and build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: word-aura/package-lock.json

      - run: npm ci

      # Fails the build if any level is impossible or any word lacks a
      # definition — the game's whole promise is that every word gets explained.
      - run: npm run validate

      - run: npm test

      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: word-aura-web
          path: word-aura/dist
          retention-days: 14

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: word-aura/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - run: npm run build

      - run: npx cap sync android

      - name: Decode release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/word-aura.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/word-aura.keystore" >> "$GITHUB_ENV"

      - name: Build debug APK
        working-directory: word-aura/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK and AAB
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        working-directory: word-aura/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: word-aura-debug-apk
          path: word-aura/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: ${{ env.ANDROID_KEYSTORE_PATH != '' }}
        with:
          name: word-aura-release
          path: |
            word-aura/android/app/build/outputs/apk/release/*.apk
            word-aura/android/app/build/outputs/bundle/release/*.aab
          retention-days: 90

      - name: Attach installable build to the GitHub release
        if: startsWith(github.ref, 'refs/tags/word-aura-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Word Aura ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            word-aura/android/app/build/outputs/apk/debug/*.apk
            word-aura/android/app/build/outputs/apk/release/*.apk
            word-aura/android/app/build/outputs/bundle/release/*.aab
