name: Word Aura Android

on:
  push:
    # `arena/**` are the agent development branches: letting them run the build
    # means an APK can be produced without touching main.
    branches: [main, "arena/**"]
    paths:
      - "word-aura/**"
      - ".github/workflows/android.yml"
    tags: ["word-aura-v*"]
  pull_request:
    paths:
      - "word-aura/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# Needed to publish the built APK to the `word-aura-builds` branch and to
# attach it to a release. Pushes made with this token do not re-trigger runs.
permissions:
  contents: write

defaults:
  run:
    working-directory: word-aura

jobs:
  build:
    name: Validate, build and sign the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: word-aura/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          build-root-directory: word-aura/android

      - name: Install dependencies
        run: npm ci

      # Fails the build if any level is impossible or any word lacks a
      # definition — every word the player can find must be explained.
      - name: Validate content
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Sync into the Android project
        run: npx cap sync android

      - name: Provision the signing key
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/word-aura.keystore"

          if [ -n "${KEYSTORE_B64}" ]; then
            echo "Using the keystore stored in repository secrets."
            printf '%s' "${KEYSTORE_B64}" | base64 --decode > "$KEYSTORE_PATH"
            echo "keystore_origin=secrets" >> "$GITHUB_OUTPUT"
          else
            # No secrets configured yet: mint a self-signed key so this build is
            # still a real, installable, signed release. The key and its password
            # are uploaded as an artifact — keep them, because Android only
            # accepts updates signed with the same key.
            echo "No signing secrets found — generating a self-signed release key."
            ALIAS="word-aura"
            PASSWORD="$(head -c 24 /dev/urandom | base64 | tr -dc 'A-Za-z0-9')"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass "$PASSWORD" -keypass "$PASSWORD" \
              -dname "CN=Word Aura, OU=Mobile, O=Word Aura, L=Lagos, C=NG"

            printf 'alias=%s\nstore_password=%s\nkey_password=%s\n' \
              "$ALIAS" "$PASSWORD" "$PASSWORD" > "$RUNNER_TEMP/signing-key.txt"

            echo "keystore_origin=generated" >> "$GITHUB_OUTPUT"
            echo "ANDROID_KEYSTORE_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          fi

          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build debug, release APK and AAB
        working-directory: word-aura/android
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Verify the signature
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/signature.txt"
          echo "### Signed APK" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          sha256sum "$APK" android/app/build/outputs/apk/debug/app-debug.apk >> "$GITHUB_STEP_SUMMARY"
          grep -E "Verified using|Signer #1 certificate DN" "$RUNNER_TEMP/signature.txt" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the installable APK to the word-aura-builds branch
        if: github.event_name != 'pull_request'
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref_name }}
          KEY_ORIGIN: ${{ steps.signing.outputs.keystore_origin }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/publish" && mkdir -p "$RUNNER_TEMP/publish"
          cd "$RUNNER_TEMP/publish"

          cp "$GITHUB_WORKSPACE/word-aura/android/app/build/outputs/apk/release/app-release.apk" word-aura-release.apk
          cp "$GITHUB_WORKSPACE/word-aura/android/app/build/outputs/apk/debug/app-debug.apk" word-aura-debug.apk
          cp "$GITHUB_WORKSPACE/word-aura/android/app/build/outputs/bundle/release/app-release.aab" word-aura-release.aab
          sha256sum word-aura-release.apk word-aura-debug.apk word-aura-release.aab > SHA256SUMS.txt

          {
            echo "# Word Aura — installable builds"
            echo
            echo "Generated by GitHub Actions. This branch only ever holds the latest build."
            echo
            echo "- \`word-aura-release.apk\` — signed with the project release key"
            echo "- \`word-aura-debug.apk\` — debug keystore, for quick testing"
            echo "- \`word-aura-release.aab\` — upload this to Google Play"
            echo
            echo "Built from \`${BUILD_REF}\` at commit \`${BUILD_SHA}\`."
            echo "Signing key: ${KEY_ORIGIN}"
            echo
            echo "Install on a phone: copy the APK across, tap it, allow install from this source."
          } > README.md

          git init -q -b word-aura-builds
          git add -A
          git -c user.name="Word Aura CI" -c user.email="ci@wordaura.local" \
            commit -q -m "build: signed Word Aura APK from ${BUILD_SHA:0:7}"
          git push --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            word-aura-builds

      - uses: actions/upload-artifact@v4
        with:
          name: word-aura-apk
          path: |
            word-aura/android/app/build/outputs/apk/release/*.apk
            word-aura/android/app/build/outputs/apk/debug/*.apk
            word-aura/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      # If CI generated the key, the owner needs it to sign future updates.
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.keystore_origin == 'generated'
        with:
          name: word-aura-signing-key
          path: |
            ${{ runner.temp }}/word-aura.keystore
            ${{ runner.temp }}/signing-key.txt
            ${{ runner.temp }}/signature.txt
          retention-days: 90

      - name: Attach the build to a release
        if: startsWith(github.ref, 'refs/tags/word-aura-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Word Aura ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            word-aura/android/app/build/outputs/apk/release/*.apk
            word-aura/android/app/build/outputs/apk/debug/*.apk
            word-aura/android/app/build/outputs/bundle/release/*.aab
